services:
  - type: web
    name: anistrem-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://anistrem-993.netlify.app
      - key: ADMIN_EMAIL
        value: admin@anistrem.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10737418240"
      - key: SUPABASE_URL
        value: https://ehwcfhjkygyjtamwxbxb.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: anistrem-media
