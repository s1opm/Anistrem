<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main gradient: Cyan to Purple diagonal -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>
    <!-- Glass overlay -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.35" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.2" result="color2"/>
      <feComposite in="color2" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.15" result="color"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
    <!-- Clip for rounded square -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <g clip-path="url(#roundedClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <!-- Subtle grid pattern for texture -->
    <g opacity="0.03">
      <line x1="0" y1="64" x2="512" y2="64" stroke="white" stroke-width="1"/>
      <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
      <line x1="0" y1="192" x2="512" y2="192" stroke="white" stroke-width="1"/>
      <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
      <line x1="0" y1="320" x2="512" y2="320" stroke="white" stroke-width="1"/>
      <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
      <line x1="0" y1="448" x2="512" y2="448" stroke="white" stroke-width="1"/>
      <line x1="64" y1="0" x2="64" y2="512" stroke="white" stroke-width="1"/>
      <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
      <line x1="192" y1="0" x2="192" y2="512" stroke="white" stroke-width="1"/>
      <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
      <line x1="320" y1="0" x2="320" y2="512" stroke="white" stroke-width="1"/>
      <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
      <line x1="448" y1="0" x2="448" y2="512" stroke="white" stroke-width="1"/>
    </g>
    <!-- Glass overlay top half -->
    <rect width="512" height="256" fill="url(#glassTop)"/>
  </g>

  <!-- ===== MAIN ICON: "A" + Play Button with glow ===== -->
  <g transform="translate(80, 50)" filter="url(#neonGlow)">
    <!-- Outer "A" shape - sleek geometric triangle -->
    <path d="M176 12 L340 430 Q344 444 332 448 L20 448 Q8 444 12 430 L176 12Z" 
          fill="url(#mainGrad)" opacity="0.95"/>
    
    <!-- Glass highlight on right half -->
    <path d="M176 12 L340 430 Q344 444 332 448 L176 448 L176 12Z" 
          fill="white" opacity="0.06"/>
    
    <!-- Inner triangle cutout - creates "A" crossbar -->
    <path d="M176 130 L270 340 L82 340 Z" fill="#09090B" opacity="0.88"/>
    
    <!-- Play button - centered in the A cutout -->
    <path d="M152 175 L152 300 L248 237 Z" fill="white" opacity="0.97"/>
    
    <!-- Small dot at apex of A -->
    <circle cx="176" cy="55" r="12" fill="white" opacity="0.9"/>
    
    <!-- Subtle bottom edge -->
    <line x1="30" y1="440" x2="320" y2="440" stroke="white" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- "AS" text at bottom for small sizes -->
  <g transform="translate(0, 460)">
    <text x="256" y="36" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="30" font-weight="800" letter-spacing="6"
          fill="white" opacity="0.7">ANISTREM</text>
  </g>
</svg>