<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" fill="none">
  <defs>
    <!-- Main gradient: Cyan to Purple -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Cyan gradient for icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <!-- Purple gradient for accent -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- Neon glow filter - Cyan -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle outer glow -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glass effect gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- ===== ICON: Stylized "A" + Play Button ===== -->
  <g transform="translate(10, 10)" filter="url(#outerGlow)">
    <!-- Outer shield/A shape - geometric triangle with clipped corners -->
    <path d="M40 4 L76 80 Q78 84 74 86 L6 86 Q2 84 4 80 L40 4Z" 
          fill="url(#mainGrad)" opacity="0.95"/>
    <!-- Glass overlay on top half -->
    <path d="M40 4 L76 80 Q78 84 74 86 L42 86 L40 4Z" 
          fill="url(#glassGrad)"/>
    <!-- Inner cutout - creates the "A" crossbar effect -->
    <path d="M40 28 L58 62 L22 62 Z" fill="#09090B" opacity="0.85"/>
    <!-- Play triangle - centered in the A cutout -->
    <path d="M36 34 L36 56 L52 45 Z" fill="white" opacity="0.95"/>
    <!-- Small accent dot - top of A -->
    <circle cx="40" cy="16" r="3" fill="white" opacity="0.9"/>
    <!-- Subtle bottom edge highlight -->
    <line x1="10" y1="84" x2="70" y2="84" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(100, 18)">
    <!-- "Ani" in Cyan with glow -->
    <text x="0" y="52" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="52" font-weight="800" letter-spacing="-1"
          fill="#00E5FF" filter="url(#glowCyan)">Ani</text>
    <!-- "Strem" in Purple/White gradient -->
    <text x="108" y="52" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="52" font-weight="800" letter-spacing="-1"
          fill="white">Strem</text>
    <!-- Subtle underline accent -->
    <rect x="0" y="62" width="220" height="2" rx="1" fill="url(#mainGrad)" opacity="0.5"/>
    <!-- Tagline -->
    <text x="1" y="78" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="11" font-weight="400" letter-spacing="3.5"
          fill="#7C3AED" opacity="0.8">STREAM YOUR ANIME UNIVERSE</text>
  </g>
</svg>